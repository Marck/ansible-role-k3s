---
# Node-level DNS servers (tasks/configure_dns.yaml). Public resolvers only —
# NEVER the in-cluster AdGuard VIP, or nodes cannot pull images while the
# cluster's own DNS is down. Override in the playbook's group_vars if needed.
#
# Use TWO DIFFERENT OPERATORS, not two addresses from one. This used to be
# 1.1.1.1 + 1.0.0.1 — both Cloudflare, one anycast network — which is a pair of
# addresses, not a pair of providers. On 2026-08-19 both timed out together for
# 42 minutes (318 failures across 39 domains: package registries, the ArgoCD
# repo-server's SRV lookups, the cloudflared tunnel, and every Home Assistant
# cloud integration). Every pod in the cluster resolves through these, because
# CoreDNS forwards what it cannot answer to the node's resolver — so a single
# provider having a bad hour is a cluster-wide DNS outage.
#
# The resolver list is ordered: the first is tried first, the second only when
# it does not answer. Keeping one Cloudflare entry preserves the usual fast
# path; Quad9 is a separate operator on a separate network, so the two are
# unlikely to fail in the same event.
k3s_node_dns_servers:
  - 1.1.1.1        # Cloudflare
  - 9.9.9.9        # Quad9 — deliberately a DIFFERENT operator, not 1.0.0.1

# Node kernel tunables (tasks/configure_sysctl.yaml), written to
# /etc/sysctl.d/90-k3s.conf. Values are treated as minimums: the task asserts
# the running value is at least this, so a later drop-in silently overriding one
# fails the play instead of passing.
k3s_node_sysctls:
  # 128 by default, counted per uid across the WHOLE node — every root
  # container shares it. systemd-as-PID-1 (unifi-os-server) cannot allocate its
  # manager object once it runs out and exits before starting a single unit.
  fs.inotify.max_user_instances: 1024

# ── k3s version and upgrades ────────────────────────────────────────────────
# The installer used to be called with no version at all
# (`curl -sfL https://get.k3s.io | sh`), which means a node got whatever was
# "stable" the day it was built and then never moved again: the install task is
# guarded by `when: not k3s_binary.stat.exists`. That is how this cluster ended
# up on v1.29.6, which reached upstream end of life on 2025-02-28.
#
# A FRESH node now follows k3s_channel, so a new cluster gets the current
# release without anyone having to remember a version number.
k3s_channel: stable

# Pin an exact release (e.g. "v1.30.14+k3s2") to override the channel entirely.
# Empty means "resolve k3s_channel at run time".
k3s_version: ""

# Upgrades are OPT-IN, and deliberately so. Without this the role still only
# installs where k3s is absent, so an unrelated playbook run can never restart
# the control plane underneath a running cluster. Turn it on for the upgrade
# itself:
#
#   ansible-playbook install_kubernetes.yaml --tags cluster \
#     -e k3s_upgrade=true -e k3s_channel=v1.30
#
k3s_upgrade: false

# Kubernetes does not support skipping minor versions, and k3s inherits that:
# 1.29 -> 1.30 -> 1.31 -> ... one hop at a time, cluster verified healthy in
# between. With k3s_channel at "stable" an out-of-date cluster would otherwise
# try to jump straight to the newest release in a single run.
#
# So an upgrade that crosses more than one minor FAILS the play instead of
# running. Set this true only if you genuinely mean to skip, and know why.
k3s_allow_minor_skip: false

# Walk forward ONE minor per run, rather than aiming straight at k3s_channel.
# This is what makes the upgrade a repeatable command instead of a lookup: run
# it, get 1.30; verify; run the same command again, get 1.31; and so on until
# the cluster reaches the stable release, after which it reports "no change".
#
# Set false to target k3s_channel / k3s_version verbatim (still refused if that
# would skip a minor, unless k3s_allow_minor_skip is also set).
k3s_upgrade_step: true

# Overridable so the version-resolution logic can be exercised against a stub
# binary instead of a real node.
k3s_binary_path: /usr/local/bin/k3s

# ── Graceful node shutdown (tasks/configure_graceful_shutdown.yaml) ─────────
# How long a clean poweroff/reboot waits for the kubelet to stop pods, and how
# much of that is reserved for system-critical pods (Traefik, CoreDNS), which
# go last. Regular pods get the difference (40s), above the default 30s
# terminationGracePeriodSeconds, so databases still stop cleanly. The critical
# share must stay below the total or the kubelet refuses to start.
k3s_shutdown_grace_period_seconds: 60
k3s_shutdown_grace_period_critical_pods_seconds: 20
# Where k3s points the kubelet's --config-dir. Not a k3s option; only the tests
# change it.
k3s_kubelet_config_dir: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
# false writes the drop-in without restarting k3s or reading back (tests only).
k3s_graceful_shutdown_apply: true

