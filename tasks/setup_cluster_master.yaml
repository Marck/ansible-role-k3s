---
- name: masters | Setup k3s masters
  block:
    - name: masters | Resolve the k3s version to install
      include_tasks: resolve_version.yaml

    # INSTALL_K3S_VERSION is passed explicitly rather than letting the installer
    # pick: unversioned is how this cluster ended up on an end-of-life release
    # and stayed there. Re-running the installer over an existing node is the
    # documented k3s upgrade path; it replaces the binary and restarts the unit,
    # so the API is briefly unavailable. Servers before agents, which is the
    # order the playbook's separate plays already give us.
    - name: masters | Install or upgrade k3s and init cluster
      shell: "curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION='{{ k3s_target_version }}' K3S_TOKEN='{{ kubernetes.server_token }}' sh -s - server --cluster-init --write-kubeconfig-mode=0600"
      # no_log: true # token
      register: k3s_cluster_setup_masters_result
      when: k3s_should_install | bool

    - name: masters | Wait for api server to become ready
      pause:
        seconds: 120
      when:
        - k3s_cluster_setup_masters_result is not skipped
        - k3s_cluster_setup_masters_result.changed is true
      
    - name: masters | Get nodes
      shell: kubectl get nodes -o wide
      register: k3s_nodes_status
      changed_when: false

    - name: masters | Debug results
      debug:
        msg: "{{ item.stdout }}"
      loop:
        - "{{ k3s_nodes_status }}"
  become: true